<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    
        <div class="gallery">

            <h1>My Image Gallery</h1>

            <div class="thumbnails">
                    <img src="image/image1.jpg" id="thumb1" alt="Image1">
                    <img src="image/image2.jpg" id="thumb2" alt="Image2">
                    <img src="image/image3.jpg" id="thumb3" alt="Image3">
                    <img src="image/image4.jpg" id="thumb4" alt="Image4">
             </div>

             <div class="display-area">
                    <img src="image/image1.jpg" id="bigImage" alt="Big Image">
            </div>

            <button id = "pauseButton">Pause</button>
            <button id = "playButton">Play</button>
        </div>
        <script src="script.js"></script>

</body>

</html>
